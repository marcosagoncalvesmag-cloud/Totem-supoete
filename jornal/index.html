<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chronicle - Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Old+Standard+TT:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Old Standard TT', serif; background: #f4f1ea; color: #1a1a1a; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .newspaper-container { width: 880px; background: #fff; border: 2px solid #333; padding: 25px; box-shadow: 10px 10px 25px rgba(0,0,0,0.2); }
        header { text-align: center; border-bottom: 5px double #000; margin-bottom: 20px; padding-bottom: 10px; }
        header h1 { font-family: 'UnifrakturMaguntia', cursive; font-size: 4.8rem; margin: 0; color: #000; }
        .sub-header { border-top: 2px solid #000; border-bottom: 2px solid #000; padding: 8px 0; font-size: 1.1rem; text-transform: uppercase; font-weight: bold; display: flex; justify-content: space-around; background: #f9f9f9; }
        #relogio { color: #d32f2f; font-family: 'Courier New', monospace; font-weight: bold; font-size: 1.3rem; }
        .main-content { display: grid; grid-template-columns: 310px 1fr; gap: 30px; }
        .sidebar { border-right: 2px solid #eee; padding-right: 20px; }
        h2 { font-size: 1.1rem; border-bottom: 2px solid #d32f2f; color: #d32f2f; padding-bottom: 5px; text-transform: uppercase; margin-top: 0; margin-bottom: 15px; }
        .logo-jornal { height: 45px; max-width: 200px; object-fit: contain; margin-bottom: 15px; display: block; }
        .headline { font-size: 2.1rem; font-weight: bold; line-height: 1.1; color: #000; margin-bottom: 15px; min-height: 80px; }
        .noticia-imagem { width: 100%; height: 350px; object-fit: cover; border: 1px solid #000; margin-top: 10px; background: #eee; }
        .fade { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        table { width: 100%; font-size: 1.2rem; border-collapse: collapse; }
        table td { padding: 12px 0; border-bottom: 1px solid #eee; font-weight: bold; }
        .txt-right { text-align: right; color: #d32f2f; }
    </style>
</head>
<body>
<div class="newspaper-container">
    <header>
        <h1>The Chronicle</h1>
        <div class="sub-header">
            <span>SÃO PAULO</span>
            <span id="data-atual"></span>
            <span id="relogio">00:00:00</span>
        </div>
    </header>
    <div class="main-content">
        <div class="sidebar">
            <h2 id="titulo-base">CÂMBIO</h2>
            <div id="conteudo-base" class="fade">Carregando...</div>
        </div>
        <div class="content">
            <h2>DESTAQUE</h2>
            <div id="container-noticia" class="fade">Sincronizando notícias...</div>
        </div>
    </div>
</div>

<script>
    const jornais = [
        { 
            nome: "G1", 
            rss: "https://g1.globo.com/rss/g1/", 
            logo: "https://s2-g1.glbimg.com/uG9X_8U6_F_O1_X_O1_X_O1_X=/i.s3.glbimg.com/v1/AUTH_59edd422c1284fa893bb774f4b23d90b/static/g1/img/g1-logo.png" 
        },
        { 
            nome: "BBC Brasil", 
            rss: "https://feeds.bbci.co.uk/portuguese/rss.xml", 
            logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/BBC_World_News_2022.svg/1024px-BBC_World_News_2022.svg.png" 
        },
        { 
            nome: "Metrópoles", 
            rss: "https://www.metropoles.com/feed", 
            logo: "https://apice.metropoles.com/wp-content/uploads/2023/04/Metropoles_Vertical_Positiva.png"
        }
    ];

    let indexNoticia = 0;
    let modoBase = 0;

    async function rodizioNoticias() {
        const cont = document.getElementById('container-noticia');
        const j = jornais[indexNoticia];
        
        // Usando o proxy rss2json para converter o XML do RSS em JSON amigável
        const urlFinal = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(j.rss)}`;

        try {
            const resp = await fetch(urlFinal);
            if (!resp.ok) throw new Error("Falha na rede");
            
            const data = await resp.json();
            if (data.status !== 'ok') throw new Error("Erro no feed");

            const item = data.items[0];
            let imgUrl = item.enclosure.link || item.thumbnail || "";

            // Busca imagem alternativa se estiver escondida no HTML da descrição
            if (!imgUrl && item.description) {
                const imgMatch = item.description.match(/<img[^>]+src="([^">]+)"/);
                if (imgMatch) imgUrl = imgMatch[1];
            }

            cont.innerHTML = `
                <div class="fade">
                    <img src="${j.logo}" class="logo-jornal" alt="${j.nome}">
                    <div class="headline">${item.title}</div>
                    ${imgUrl ? `<img src="${imgUrl}" class="noticia-imagem">` : ''}
                </div>`;
        } catch (e) {
            console.error("Erro no jornal:", j.nome, e);
            cont.innerHTML = `<div class="fade">Aguardando sinal de ${j.nome}...</div>`;
        }

        // Prepara o próximo jornal para o próximo ciclo
        indexNoticia = (indexNoticia + 1) % jornais.length;
    }

    async function rodizioBase() {
        const cont = document.getElementById('conteudo-base');
        const tit = document.getElementById('titulo-base');
        try {
            if (modoBase === 0) {
                tit.innerText = "CÂMBIO";
                const r = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL,EUR-BRL,BTC-BRL').then(res => res.json());
                cont.innerHTML = `<table>
                    <tr><td>💵 USD</td><td class="txt-right">R$ ${parseFloat(r.USDBRL.bid).toFixed(2)}</td></tr>
                    <tr><td>💶 EUR</td><td class="txt-right">R$ ${parseFloat(r.EURBRL.bid).toFixed(2)}</td></tr>
                    <tr><td>₿ BTC</td><td class="txt-right">R$ ${Math.round(r.BTCBRL.bid).toLocaleString('pt-br')}</td></tr>
                </table>`;
            } else {
                tit.innerText = "MERCADOS";
                cont.innerHTML = `<table>
                    <tr><td>🇧🇷 IBOV</td><td class="txt-right">128.432</td></tr>
                    <tr><td>📊 NASDAQ</td><td class="txt-right">18.210</td></tr>
                    <tr><td>📈 DOW JONES</td><td class="txt-right">39.150</td></tr>
                </table>`;
            }
        } catch (e) { cont.innerHTML = "Erro nos dados."; }
        modoBase = (modoBase === 0) ? 1 : 0;
    }

    function atualizarTempo() {
        const agora = new Date();
        document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-br');
        document.getElementById('data-atual').innerText = agora.toLocaleDateString('pt-br', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Inicialização e Ciclos
    atualizarTempo();
    rodizioNoticias();
    rodizioBase();

    setInterval(atualizarTempo, 1000);
    setInterval(rodizioNoticias, 15000); // 15 segundos para ler cada notícia
    setInterval(rodizioBase, 10000);
</script>
</body>
</html>
